<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Game</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 20px;
      background: #111827;
      border-bottom: 1px solid #334155;
    }

    h1 {
      margin: 0;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      flex: 1;
      min-width: 200px;
    }

    .solde {
      font-size: 28px;
      font-weight: bold;
    }

    .graphique {
      height: 250px;
      margin-top: 20px;
      border-radius: 12px;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
    }

    button {
      padding: 12px 25px;
      margin: 10px 5px 0 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .acheter {
      background: #22c55e;
      color: white;
    }

    .vendre {
      background: #ef4444;
      color: white;
    }

    .info {
      color: #94a3b8;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>📈 Trading Game</h1>
  </header>

  <div class="container">

    <div class="cards">

      <div class="card">
        <p>💰 Solde virtuel</p>
        <div class="solde">10 000 crédits</div>
      </div>

      <div class="card">
        <p>📊 Actif</p>
        <div class="solde">GOLD</div>
      </div>

    </div>

    <div class="card" style="margin-top:20px;">
      <h2>GOLD / USD</h2>

      <div class="graphique">
        📈 Graphique fictif
      </div>

      <button class="acheter">Acheter</button>
      <button class="vendre">Vendre</button>
    </div>

    <p class="info">
      ⚠️ Jeu de simulation : tous les crédits et transactions sont fictifs.
    </p>

  </div>

</body>
</html>
